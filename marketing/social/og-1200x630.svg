<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Tahoma, Segoe UI, Arial, sans-serif" role="img" aria-label="ICQ Retrogram — your WhatsApp, like it's 2003">
  <defs>
    <radialGradient id="bg" cx="70%" cy="-10%" r="120%">
      <stop offset="0%" stop-color="#3a6ea5"/><stop offset="45%" stop-color="#1c3a63"/><stop offset="100%" stop-color="#0e1f38"/>
    </radialGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D6B6B"/><stop offset="1" stop-color="#0A3A3A"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46d1c0"/><stop offset="1" stop-color="#1A8A8A"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="black" opacity="0.12"/>

  <!-- copy -->
  <g transform="translate(70,118)">
    <text x="0" y="0" font-size="26" font-weight="bold" fill="#F5C400">✿ <tspan fill="#ffffff">ICQ Retrogram</tspan></text>
    <text x="0" y="92" font-size="58" font-weight="bold" fill="#ffffff">Your WhatsApp.</text>
    <text x="0" y="154" font-size="58" font-weight="bold" fill="#2BBFBF">Like it’s 2003.</text>
    <text x="2" y="208" font-size="24" fill="#bcd3e6">WhatsApp + Telegram in a retro ICQ messenger.</text>
    <text x="0" y="262" font-size="30" font-weight="bold" fill="#F5C400">uh-oh! 🌼</text>
    <g transform="translate(0,300)">
      <rect x="0" y="0" width="240" height="56" rx="9" fill="url(#cta)" stroke="#0E5F5F"/>
      <text x="120" y="37" font-size="23" font-weight="bold" fill="#06231f" text-anchor="middle">▼ Download free</text>
    </g>
    <text x="0" y="392" font-size="18" fill="#8da3ba">Windows · macOS · Linux · open source</text>
  </g>

  <!-- compact window mock-up -->
  <g transform="translate(770,150)">
    <rect x="0" y="0" width="260" height="360" rx="10" fill="#1F2530" stroke="#4A5E78"/>
    <rect x="0" y="0" width="260" height="30" rx="10" fill="url(#tb)"/>
    <text x="14" y="20" font-size="12" font-weight="bold" fill="#fff">✿ ICQ — Retrogram</text>
    <rect x="0" y="30" width="260" height="42" fill="#0c4f4f"/>
    <circle cx="26" cy="51" r="15" fill="#2A4060"/><text x="20" y="56" font-size="13" fill="#fff">✿</text>
    <text x="48" y="47" font-size="12" font-weight="bold" fill="#fff">Felix</text>
    <text x="48" y="63" font-size="10" fill="#44DD44">● Online</text>
    <g font-size="12" fill="#E0E8F0">
      <g transform="translate(0,86)"><circle cx="26" cy="18" r="15" fill="#9c5a1e"/><text x="20" y="23" fill="#fff" font-weight="bold">A</text><text x="48" y="14" font-weight="bold">Anna</text><text x="48" y="30" font-size="10" fill="#7A90A8">So — who is online?</text><circle cx="240" cy="16" r="9" fill="#F5C400"/><text x="236" y="20" font-size="10" font-weight="bold" fill="#3a2c00">1</text></g>
      <g transform="translate(0,134)"><circle cx="26" cy="18" r="15" fill="#2f7a4a"/><text x="20" y="23" fill="#fff" font-weight="bold">M</text><text x="48" y="14" font-weight="bold">Mom</text><text x="48" y="30" font-size="10" fill="#7A90A8">Coming over Sunday?</text></g>
    </g>
    <!-- chat snippet -->
    <g transform="translate(150,196)">
      <rect x="0" y="0" width="240" height="164" rx="10" fill="#1F2530" stroke="#4A5E78"/>
      <rect x="0" y="0" width="240" height="30" rx="10" fill="url(#tb)"/>
      <text x="14" y="20" font-size="12" font-weight="bold" fill="#fff">✿ Anna</text>
      <rect x="12" y="44" width="150" height="34" rx="8" fill="#252D3A" stroke="#3A4A5E"/>
      <text x="24" y="65" font-size="11" fill="#E0E8F0">who is online? 😎</text>
      <rect x="70" y="88" width="156" height="34" rx="8" fill="#0D5C5C" stroke="#0E5F5F"/>
      <text x="82" y="109" font-size="11" fill="#E0E8F0">Feels like 2003 🌼</text>
    </g>
  </g>
</svg>
