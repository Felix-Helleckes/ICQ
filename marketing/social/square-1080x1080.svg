<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" font-family="Tahoma, Segoe UI, Arial, sans-serif" role="img" aria-label="ICQ Retrogram — WhatsApp and Telegram in a retro ICQ messenger">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="125%">
      <stop offset="0%" stop-color="#3a6ea5"/><stop offset="44%" stop-color="#1c3a63"/><stop offset="100%" stop-color="#0e1f38"/>
    </radialGradient>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D6B6B"/><stop offset="1" stop-color="#0A3A3A"/></linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46d1c0"/><stop offset="1" stop-color="#1A8A8A"/></linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="black" opacity="0.12"/>

  <text x="540" y="118" font-size="34" font-weight="bold" fill="#F5C400" text-anchor="middle">✿ <tspan fill="#ffffff">ICQ Retrogram</tspan></text>

  <text x="540" y="222" font-size="66" font-weight="bold" fill="#ffffff" text-anchor="middle">Your WhatsApp.</text>
  <text x="540" y="296" font-size="66" font-weight="bold" fill="#2BBFBF" text-anchor="middle">Like it’s 2003.</text>
  <text x="540" y="360" font-size="38" font-weight="bold" fill="#F5C400" text-anchor="middle">uh-oh! 🌼</text>

  <!-- window mock-up -->
  <g transform="translate(190,400)">
    <rect x="0" y="0" width="420" height="430" rx="12" fill="#1F2530" stroke="#4A5E78" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="40" rx="12" fill="url(#tb)"/>
    <text x="18" y="27" font-size="16" font-weight="bold" fill="#fff">✿ ICQ — Retrogram</text>
    <rect x="0" y="40" width="420" height="56" fill="#0c4f4f"/>
    <circle cx="36" cy="68" r="20" fill="#2A4060"/><text x="28" y="75" font-size="18" fill="#fff">✿</text>
    <text x="66" y="63" font-size="16" font-weight="bold" fill="#fff">Felix</text>
    <text x="66" y="85" font-size="13" fill="#44DD44">● Online</text>
    <g font-size="16" fill="#E0E8F0">
      <g transform="translate(0,116)"><circle cx="36" cy="26" r="20" fill="#9c5a1e"/><text x="29" y="32" fill="#fff" font-weight="bold">A</text><circle cx="51" cy="41" r="7" fill="#44DD44" stroke="#1F2530" stroke-width="2"/><text x="70" y="20" font-weight="bold">Anna</text><text x="70" y="42" font-size="13" fill="#7A90A8">So — who is online? 😎</text><circle cx="392" cy="22" r="13" fill="#F5C400"/><text x="387" y="28" font-size="15" font-weight="bold" fill="#3a2c00">1</text></g>
      <g transform="translate(0,182)"><circle cx="36" cy="26" r="20" fill="#2f7a4a"/><text x="29" y="32" fill="#fff" font-weight="bold">M</text><circle cx="51" cy="41" r="7" fill="#44DD44" stroke="#1F2530" stroke-width="2"/><text x="70" y="20" font-weight="bold">Mom</text><text x="70" y="42" font-size="13" fill="#7A90A8">Coming over on Sunday?</text></g>
    </g>
    <!-- chat snippet -->
    <g transform="translate(250,250)">
      <rect x="0" y="0" width="380" height="280" rx="12" fill="#1F2530" stroke="#4A5E78" stroke-width="2"/>
      <rect x="0" y="0" width="380" height="40" rx="12" fill="url(#tb)"/>
      <text x="18" y="27" font-size="16" font-weight="bold" fill="#fff">✿ WhatsApp — Anna</text>
      <rect x="18" y="62" width="250" height="46" rx="10" fill="#252D3A" stroke="#3A4A5E"/>
      <text x="34" y="90" font-size="16" fill="#E0E8F0">So — who is online? 😎</text>
      <rect x="118" y="122" width="244" height="46" rx="10" fill="#0D5C5C" stroke="#0E5F5F"/>
      <text x="134" y="150" font-size="16" fill="#E0E8F0">Me. Feels like 2003 🌼</text>
      <rect x="18" y="182" width="266" height="46" rx="10" fill="#252D3A" stroke="#3A4A5E"/>
      <text x="34" y="210" font-size="16" fill="#E0E8F0">WAIT — is that ICQ?! 😂</text>
    </g>
  </g>

  <!-- skins + CTA -->
  <g transform="translate(300,892)">
    <rect x="0" y="4" width="36" height="36" rx="8" fill="#0D6B6B" stroke="#000" stroke-opacity="0.3"/>
    <rect x="48" y="4" width="36" height="36" rx="8" fill="#5CA52E" stroke="#000" stroke-opacity="0.3"/>
    <rect x="96" y="4" width="36" height="36" rx="8" fill="#2E86DE" stroke="#000" stroke-opacity="0.3"/>
    <text x="148" y="30" font-size="22" fill="#cfe0ee">3 skins · ICQ · MSN · Telegram</text>
  </g>
  <g transform="translate(360,956)">
    <rect x="0" y="0" width="360" height="68" rx="12" fill="url(#cta)" stroke="#0E5F5F"/>
    <text x="180" y="44" font-size="28" font-weight="bold" fill="#06231f" text-anchor="middle">▼ Download free</text>
  </g>
  <text x="540" y="1052" font-size="20" fill="#8da3ba" text-anchor="middle">WhatsApp + Telegram · Windows · macOS · Linux · open source</text>
</svg>
