name: Build Mac App Store package

# Signed .pkg for the Mac App Store (sandboxed MAS build of Electron). Not part of
# the normal release: the DMG for GitHub stays in build-platforms.yml.
#
#   gh workflow run build-mas.yml
#   gh workflow run build-mas.yml -f upload=true     # also send to App Store Connect
#
# Needs these repository secrets (see docs/store.md):
#   MAS_APP_CERT_P12, MAS_INSTALLER_CERT_P12, MAS_CERT_PASSWORD,
#   MAS_PROVISIONING_PROFILE, MAS_TEAM_ID
# and, only for upload=true:
#   MAS_API_KEY_P8 (base64 of AuthKey_XXXX.p8), MAS_API_KEY_ID, MAS_API_ISSUER_ID
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the .pkg to App Store Connect (TestFlight / review)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mas:
    name: macOS App Store (.pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests (gate)
        run: npm run lint && npm run test:electron && npm run test:unit
        env:
          CI: "true"
      - name: Build renderer
        run: npm run build
        env:
          CI: "false"

      - name: Import signing certificates into a temporary keychain
        env:
          APP_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          INSTALLER_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mas.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/app.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KEYCHAIN"
          echo "$PROFILE" | base64 --decode > store/mas/embedded.provisionprofile
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

      # The Windows/DMG builds keep appId com.icqmessenger.app (changing it would
      # break in-place updates of the installed Windows app). Only the store build
      # uses the bundle id registered at Apple and the store name.
      - name: Build sandboxed .pkg (universal)
        run: >
          npx electron-builder --mac mas --universal --publish never
          -c.appId=de.helleckes.retrogram
          -c.productName=Retrogram
          -c.buildVersion=${{ github.run_number }}
          -c.mas.identity="Felix Helleckes (${{ secrets.MAS_TEAM_ID }})"

      - name: List result
        run: ls -la dist/mas* dist/*.pkg 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: retrogram-mas-pkg
          path: dist/**/*.pkg
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          API_KEY_P8: ${{ secrets.MAS_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.MAS_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.MAS_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$API_KEY_P8" | base64 --decode > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
          PKG="$(ls dist/mas*/*.pkg dist/*.pkg 2>/dev/null | head -n1)"
          echo "Uploading $PKG"
          xcrun altool --upload-app -f "$PKG" -t macos --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -f ~/.private_keys/AuthKey_${API_KEY_ID}.p8
