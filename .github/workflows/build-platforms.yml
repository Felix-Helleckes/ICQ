name: Build macOS/Linux for a release

# Windows builds are made locally and published with `gh release create` (see
# docs/release.md). macOS can only be built on a Mac and Linux needs Linux tools
# (mksquashfs for the AppImage, fpm for the .deb), so these two run here and attach
# their files to the release that already exists — usually still a draft.
#
#   gh workflow run build-platforms.yml -f tag=v1.1.0
#
# Public repository: standard GitHub runners cost no minutes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag the files are attached to, e.g. v1.1.0'
        required: true
      platforms:
        description: 'Which builds: mac, linux or mac,linux'
        required: true
        default: 'mac,linux'

permissions:
  contents: write

concurrency:
  group: build-platforms-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mac:
    if: contains(inputs.platforms, 'mac')
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Version matches the tag
        run: |
          V="v$(node -p "require('./package.json').version")"
          [ "$V" = "${{ inputs.tag }}" ] || { echo "::error::package.json is $V, tag is ${{ inputs.tag }}"; exit 1; }
      - run: npm ci
      - name: Tests (gate)
        run: npm run lint && npm run test:electron && npm run test:unit
        env:
          CI: "true"
      - name: Build renderer
        run: npm run build
        env:
          CI: "false"
      # Unsigned/ad-hoc DMGs open as "damaged" after download (quarantine), so the
      # build only goes out signed with Developer ID and notarized. Secrets: docs/release.md.
      - name: Build signed + notarized dmg (Apple Silicon + Intel)
        env:
          CSC_LINK: ${{ secrets.MAC_DEVID_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVID_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!v}" ] || { echo "::error::Secret for $v missing — refusing to ship an unsigned dmg"; exit 1; }
          done
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$API_KEY_P8" | base64 --decode > "$APPLE_API_KEY"
          npx electron-builder --mac dmg --arm64 --x64 --publish never
          rm -f "$APPLE_API_KEY"
      - name: Verify Gatekeeper accepts the app
        run: |
          for app in dist/mac*/*.app; do
            spctl -a -vvv -t exec "$app"
            xcrun stapler validate "$app"
          done
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/*.dmg --clobber

  linux:
    if: contains(inputs.platforms, 'linux')
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Version matches the tag
        run: |
          V="v$(node -p "require('./package.json').version")"
          [ "$V" = "${{ inputs.tag }}" ] || { echo "::error::package.json is $V, tag is ${{ inputs.tag }}"; exit 1; }
      - name: System packages (Electron runtime for the E2E smoke, fpm deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 \
            libasound2t64 libxss1 libxtst6 libxrandr2 libx11-xcb1 libgtk-3-0 rpm || true
      - run: npm ci
      - name: Tests (gate)
        run: npm run lint && npm run test:electron && npm run test:unit
        env:
          CI: "true"
      - name: Build renderer
        run: npm run build
        env:
          CI: "false"
      - name: E2E smoke on Linux (boot, skins, voice recording)
        run: xvfb-run -a npx playwright test
      - name: Build AppImage + deb
        run: npx electron-builder --linux AppImage deb --publish never
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" dist/*.AppImage dist/*.deb --clobber
