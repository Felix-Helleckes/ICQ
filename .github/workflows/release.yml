name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libnss3 libatk-bridge2.0-0 libx11-xcb1 libxcb-dri3-0 libdrm2 libgbm1 libasound2

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Build Electron - Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron - macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron - Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ICQ Messenger ${{ github.ref_name }}
          body: |
            ## ICQ Messenger ${{ github.ref_name }}

            Retro ICQ 5-style multi-messenger for WhatsApp + Telegram.

            ### Downloads
            | Plattform | Datei | Hinweis |
            |-----------|-------|---------|
            | Windows | `ICQ-Messenger-Setup-*.exe` | Installer (empfohlen) |
            | Windows | `ICQ-Messenger-*.exe` | Portable |
            | macOS | `ICQ-Messenger-*.dmg` | Unsigned - siehe unten |
            | Linux | `ICQ-Messenger-*.AppImage` | Portable, direkt ausfuehrbar |
            | Linux | `icq-messenger_*.deb` | Debian/Ubuntu |

            ### macOS - Gatekeeper
            Rechtsklick auf .app -> "Oeffnen" -> "Oeffnen" bestaetigen
            Oder: `xattr -cr /Applications/ICQ\ Messenger.app`

            ### Windows - SmartScreen
            "Weitere Informationen" -> "Trotzdem ausfuehren"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
