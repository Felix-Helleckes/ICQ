name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG — aborting so we never ship mislabeled binaries again."
            exit 1
          fi

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libasound2t64 \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libx11-xcb1 || true

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_CACHE_DIR: ./puppeteer_cache

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Build Electron - Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --publish never

      - name: Build Electron - macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron - Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish never

      # Upload build artifacts for the release job
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # Run even if some builds failed, so we publish whatever was built
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: List files
        run: find dist-all -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ICQ Messenger ${{ github.ref_name }}
          body: |
            ## ICQ Messenger ${{ github.ref_name }}

            Retro ICQ 5-style multi-messenger for WhatsApp + Telegram.

            ### Downloads
            | Plattform | Datei | Hinweis |
            |-----------|-------|---------|
            | Windows | `ICQ-Messenger-Setup-*.exe` | Installer (empfohlen) |
            | Windows | `ICQ-Messenger-*-Portable.exe` | Portable - Login bleibt im `ICQ-Data`-Ordner daneben |
            | macOS | `ICQ-Messenger-*.dmg` | arm64 (M1/M2/M3 nativ, Intel via Rosetta 2) |
            | Linux | `ICQ-Messenger-*.AppImage` | Portable, direkt ausfuehrbar |
            | Linux | `icq-messenger_*.deb` | Debian/Ubuntu |

            ### Portable Windows
            `ICQ-Data`-Ordner neben der `.exe` behaelt Login-Session. Einfach beide zusammen kopieren (z.B. auf USB-Stick).

            ### macOS - "Datei ist beschaedigt"
            Da die App nicht notarisiert ist, blockiert macOS den Start. **Einmalig** im Terminal:
            ```
            xattr -cr /Applications/ICQ\ Messenger.app
            ```
            Danach startet die App normal. Alternativ: Rechtsklick auf .app -> "Oeffnen" -> "Oeffnen" bestaetigen.

            ### Windows - SmartScreen
            "Weitere Informationen" -> "Trotzdem ausfuehren"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist-all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
