name: Release

# Every push to main publishes a release, using the version from package.json.
# Bump "version" in package.json and push — the tag (v<version>) is created by this
# workflow, so no manual tagging is needed. Pushing again WITHOUT bumping the version
# is a no-op: the existing release is never overwritten.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases run at once — they would race on the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the full tag list to detect an already-released version

      - name: Resolve version and decide whether to release
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released — bump \"version\" in package.json to publish a new one."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$VERSION"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    if: needs.check.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libasound2t64 \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libx11-xcb1 || true

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_CACHE_DIR: ./puppeteer_cache

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Build Electron - Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis portable --publish never

      - name: Build Electron - macOS
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron - Linux
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage deb --publish never

      # Upload build artifacts for the release job
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
          retention-days: 1

  release:
    name: Publish Release
    needs: [check, build]
    runs-on: ubuntu-latest
    # All three platform builds must succeed. Publishing on partial success would
    # silently ship a release missing, say, the Windows installer — and since this
    # now runs automatically on every push, nobody would notice.
    if: needs.check.outputs.should_release == 'true'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: List files
        run: find dist-all -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The tag does not exist yet — the action creates it on the pushed commit.
          tag_name: v${{ needs.check.outputs.version }}
          name: ICQ Messenger v${{ needs.check.outputs.version }}
          body: |
            ## ICQ Messenger v${{ needs.check.outputs.version }}

            Retro ICQ 5-style multi-messenger for WhatsApp + Telegram.

            ### Downloads
            | Plattform | Datei | Hinweis |
            |-----------|-------|---------|
            | Windows | `ICQ-Messenger-Setup-*.exe` | Installer (empfohlen) |
            | Windows | `ICQ-Messenger-*-Portable.exe` | Portable - Login bleibt im `ICQ-Data`-Ordner daneben |
            | macOS | `ICQ-Messenger-*.dmg` | arm64 (M1/M2/M3 nativ, Intel via Rosetta 2) |
            | Linux | `ICQ-Messenger-*.AppImage` | Portable, direkt ausfuehrbar |
            | Linux | `icq-messenger_*.deb` | Debian/Ubuntu |

            ### Portable Windows
            `ICQ-Data`-Ordner neben der `.exe` behaelt Login-Session. Einfach beide zusammen kopieren (z.B. auf USB-Stick).

            ### macOS - "Datei ist beschaedigt"
            Da die App nicht notarisiert ist, blockiert macOS den Start. **Einmalig** im Terminal:
            ```
            xattr -cr /Applications/ICQ\ Messenger.app
            ```
            Danach startet die App normal. Alternativ: Rechtsklick auf .app -> "Oeffnen" -> "Oeffnen" bestaetigen.

            ### Windows - SmartScreen
            "Weitere Informationen" -> "Trotzdem ausfuehren"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist-all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
