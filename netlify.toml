# ÜBERGANGSZUSTAND — die Seite ist zu Cloudflare Pages umgezogen.
# Neu: https://icq-retrogram.pages.dev (Konfiguration in wrangler.toml)
#
# Diese Datei bleibt vorerst, damit der alte Netlify-Stand nicht einfach
# verschwindet. Reihenfolge beim Umzug:
#
#   1. Cloudflare-Pages-Projekt anlegen und deployen lassen.
#   2. Prüfen, dass https://icq-retrogram.pages.dev wirklich ausliefert.
#   3. ERST DANN den Weiterleitungsblock unten entkommentieren und pushen.
#   4. Ein paar Monate laufen lassen, dann das Netlify-Projekt löschen.
#
# Schritt 3 vor Schritt 2 legt die Seite lahm: Netlify leitet dann auf einen
# Host weiter, den es noch nicht gibt.
#
# Warum nicht sofort löschen: 301 sagt Google und jedem Dienst, der den alten
# Link kennt, wohin die Seite gezogen ist, und vererbt die bisherige Bewertung
# weiter. Ein gelöschtes Projekt antwortet stattdessen mit 404 — jeder bereits
# gesetzte Link, jedes Lesezeichen und jede Pressemeldung läuft ins Leere, und
# das lässt sich nachträglich nicht mehr einsammeln.

[build]
  publish = "site"
  command = "echo 'static site — no build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "https://icq-retrogram.pages.dev/:splat"
  status = 301
  force = true
